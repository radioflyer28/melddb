name: CI

on:
  push:
  pull_request:

env:
  UV_MANAGED_PYTHON: "true"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --extra test pytest
      - run: uv run python -c "import sqlite3; print(sqlite3.sqlite_version)"
      - run: uv run python examples/workflows.py .demo
      - run: uv run python examples/query_crud.py .demo/queries
      - run: uv run python examples/dependencies.py
      - run: uv run python examples/schema_evolution.py
      - run: uv run python examples/recovery.py
      - run: uv run python examples/logical_transfer.py
      - run: uv build
      - run: uv run python validation/qualify.py dist/melddb-0.1.0rc1-py3-none-any.whl dist/melddb-0.1.0rc1.tar.gz --output qualification.json
      - uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ matrix.os }}-${{ matrix.python }}
          path: qualification.json

  postgres-proof:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: melddb-proof
          POSTGRES_DB: melddb_proof
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MELDDB_TEST_POSTGRES: postgresql://postgres:melddb-proof@localhost:5432/melddb_proof
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv run --extra test --extra postgres pytest

  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv run --extra test ruff check .
      - run: uv run --extra test python validation/comparison.py
      - run: uv run --extra test python validation/traversal_scale.py
      - run: uv run python validation/release_performance.py
      - run: node compat/read-export.ts tests/fixtures/logical-export.json
      - run: uv run --extra test pytest tests/test_artifacts.py -k typescript
      - run: uv build
